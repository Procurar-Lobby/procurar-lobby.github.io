<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procurar Lobby</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5fb;--card:#fff;--text:#16182b;--mut:#666b85;--line:#dfe2f0;--acc:#6c3df4;--acc2:#fff;--ok:#12a36b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#1a1c33;--text:#eceefc;--mut:#9aa0c3;--line:#2c2f52;--acc:#8d6bff;--acc2:#0f1020;--ok:#3ed39a}}
:root[data-theme="dark"]{--bg:#0f1020;--card:#1a1c33;--text:#eceefc;--mut:#9aa0c3;--line:#2c2f52;--acc:#8d6bff;--acc2:#0f1020;--ok:#3ed39a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#lang{width:auto;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600}
.tab.on{background:var(--acc);color:var(--acc2);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pri{background:var(--acc);color:var(--acc2);border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;margin-top:12px;width:100%}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600}
a.sec{text-decoration:none;display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:8px 12px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px}
.chip.on{background:var(--acc);color:var(--acc2);border-color:var(--acc);font-weight:700}
.pick{display:flex;align-items:center;gap:8px;margin:8px 0}.pick input{width:auto}
.pick small{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.th{display:block;width:100%;text-align:left;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font:inherit}
.th.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.th small{display:block;color:var(--mut)}
.lnk{background:none;border:0;padding:0;color:var(--text);font:inherit;font-weight:700;font-size:16px;text-decoration:underline dotted;cursor:pointer;text-align:left}
.ok.no{color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-left:6px;vertical-align:middle}
.bdg{background:#ef4444;color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;margin-left:4px}
#pv{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:6;padding:16px}
#pv.on{display:flex}
.pvc{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90%;overflow-y:auto}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.pr span{color:var(--mut);font-size:13px}
.sec.on{background:var(--acc);color:var(--acc2)}
.rate{display:inline-flex;gap:6px}
.rep{font-size:12px;color:var(--mut);margin-left:6px}
.ok-v{color:var(--ok);font-size:12px;font-weight:600;margin-left:6px}
.blk{background:none;border:0;padding:0 0 0 4px;font-size:11px;opacity:.6;cursor:pointer}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nick{font-weight:700;font-size:16px}.ok{color:var(--ok);font-weight:600;font-size:12px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
#chat{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
#chat.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;height:80%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--acc);color:var(--acc2);border-color:var(--acc)}
.m small{display:block;opacity:.7;font-size:11px}
.send{display:flex;gap:8px}.send button{margin:0;width:auto}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>🎮 <span data-i18n="title"></span></h1><p class="sub" data-i18n="sub"></p></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button class="sec" id="authBtn" data-i18n="login"></button>
    <select id="lang" aria-label="Language">
      <option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option>
    </select></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="ads" data-i18n="tabAds"></button>
    <button class="tab" data-t="chats"><span data-i18n="tabChats"></span><span id="badge" class="bdg" hidden></span></button>
    <button class="tab" data-t="new" data-i18n="tabNew"></button>
    <button class="tab" data-t="prof" data-i18n="tabProf"></button>
  </div>

  <section id="ads">
    <div class="filters">
      <select id="fMode"><option value="" data-i18n="allModes"></option><option>Duo</option><option>Trio</option><option>Squad (4)</option></select>
      <select id="fPlat"><option value="" data-i18n="allPlats"></option><option>PC</option><option>PlayStation</option><option>Xbox</option><option>Switch</option><option>Mobile</option></select>
      <select id="fLvl"><option value="" data-i18n="allRanks"></option><option>Bronze</option><option>Silver</option><option>Gold</option><option>Platinum</option><option>Diamond</option><option>Elite</option><option>Champion</option><option>Unreal</option></select>
      <select id="fRole"><option value="" data-i18n="allRoles"></option><option value="Fragger">Fragger</option><option value="IGL">IGL</option><option value="Support" data-i18n="roleSup"></option></select>
      <select id="fSrv"><option value="" data-i18n="allSrv"></option><option>Europe</option><option>NA East</option><option>NA Central</option><option>NA West</option><option>Brazil</option><option>Asia</option><option>Oceania</option><option>Middle East</option></select>
      <button class="sec" id="fSaved" style="grid-column:1/-1" data-i18n="onlySaved"></button>
      <input id="fText" data-ph="fText" style="grid-column:1/-1">
    </div>
    <div id="list"></div>
  </section>

  <section id="chats" hidden><div id="chatList"></div></section>

  <section id="new" hidden>
    <div class="card">
      <h2 data-i18n="pubH"></h2>
      <label data-i18n="tour"></label><input id="aTour" data-ph="tourPh">
      <div class="row">
        <div><label data-i18n="mode"></label><select id="aMode"><option>Duo</option><option>Trio</option><option>Squad (4)</option></select></div>
        <div><label data-i18n="date"></label><input id="aDate" type="date"></div>
      </div>
      <label data-i18n="srv"></label><select id="aSrv"><option>Europe</option><option>NA East</option><option>NA Central</option><option>NA West</option><option>Brazil</option><option>Asia</option><option>Oceania</option><option>Middle East</option></select>
      <label data-i18n="needL"></label>
      <div class="row3">
        <div><label>Fragger</label><select id="nFragger"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
        <div><label>IGL</label><select id="nIGL"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
        <div><label data-i18n="roleSup"></label><select id="nSupport"><option>0</option><option>1</option><option>2</option><option>3</option></select></div>
      </div>
      <label data-i18n="note"></label><textarea id="aNote" rows="2" data-ph="notePh"></textarea>
      <p class="note" data-i18n="pubNote"></p>
      <button class="pri" id="pub" data-i18n="pubBtn"></button>
    </div>
  </section>

  <section id="prof" hidden>
    <div class="card">
      <h2 data-i18n="profH"></h2>
      <label data-i18n="nick"></label><input id="pNick" maxlength="24">
      <div class="row">
        <div><label data-i18n="plat"></label><select id="pPlat"><option>PC</option><option>PlayStation</option><option>Xbox</option><option>Switch</option><option>Mobile</option></select></div>
        <div><label data-i18n="rank"></label><select id="pLvl"><option>Bronze</option><option>Silver</option><option>Gold</option><option>Platinum</option><option>Diamond</option><option>Elite</option><option>Champion</option><option>Unreal</option></select></div>
      </div>
      <label data-i18n="srv"></label><select id="pSrv"><option>Europe</option><option>NA East</option><option>NA Central</option><option>NA West</option><option>Brazil</option><option>Asia</option><option>Oceania</option><option>Middle East</option></select>
      <label data-i18n="role"></label><select id="pRole"><option value="Fragger">Fragger</option><option value="IGL">IGL</option><option value="Support" data-i18n="roleSup"></option></select>
      <label data-i18n="region"></label><input id="pReg" data-ph="regionPh">
      <label data-i18n="disc"></label><input id="pDisc" data-ph="discPh">
      <label data-i18n="trk"></label><input id="pTrk" data-ph="trkPh" inputmode="url">
      <button class="pri" id="saveP" data-i18n="saveP"></button>
      <p class="note" data-i18n="profNote"></p>
    </div>
  </section>
</main>

<div id="chat">
  <div class="sheet">
    <div class="top"><h2 id="cTitle" style="margin:0"></h2><button class="sec" id="cClose" data-i18n="close"></button></div>
    <div id="cSub" class="note" style="margin:2px 0 0"></div>
    <div id="rateBar" class="note" style="margin:2px 0 0"></div>
    <div id="actBar" class="acts" style="margin:6px 0 0"></div>
    <div id="chips" class="chips"></div>
    <div id="msgs"></div>
    <div class="send"><input id="cIn" data-ph="msgPh" maxlength="300"><button class="pri" id="cSend" data-i18n="send"></button></div>
  </div>
</div>

<div id="pv"><div class="pvc" id="pvBox"></div></div>

      ${trkHref(a.trk||"")?`<a class="sec" href="${trkHref(a.trk)}" target="_blank" rel="noopener noreferrer">📊 Tracker</a>`:""}
      ${a.authorId===myId?`<button class="sec" data-fill="${a.id}" data-to="${a.open===false?"1":"0"}">${a.open===false?t("reopen"):t("markFilled")}</button>`:""}

function syncNeed(chg){
  const mode=$("#aMode").value,max={Duo:1,Trio:2,"Squad (4)":3}[mode];
  const a=[$("#nFragger"),$("#nIGL"),$("#nSupport")],sup=a[2];
  if(mode==="Duo")sup.value="0";
  a.forEach(e=>{[...e.options].forEach(o=>o.disabled=+o.value>max);if(+e.value>max)e.value=String(max)});
  const sum=()=>a.reduce((n,e)=>n+ +e.value,0);
  for(const e of a.filter(e=>e!==chg&&!(mode==="Duo"&&e===sup))){while(sum()>max&&+e.value>0)e.value=String(+e.value-1)}
  sup.disabled=mode==="Duo";
}
$("#aMode").onchange=()=>syncNeed();

const sid=x=>String(x).replace(/[^A-Za-z0-9_.~:@+-]/g,"_");
function showTab(n){document.querySelector('[data-t="'+n+'"]').click()}
const RANKS=["Bronze","Silver","Gold","Platinum","Diamond","Elite","Champion","Unreal"];
let saved=new Set(),onlySaved=false,rat={},myRat={},pvAd=null;
try{saved=new Set(JSON.parse(localStorage.getItem("saved")||"[]"))}catch(e){}
function trkName(u){try{const p=new URL(u).pathname.split("/").filter(Boolean);return p[0]==="profile"&&p[2]?decodeURIComponent(p[2]).trim():""}catch(e){return ""}}
const verOf=a=>{const n=trkName(a.trk||"");return !!n&&!!trkHref(a.trk||"")&&n.toLowerCase()===String(a.nick||"").trim().toLowerCase()};
const repOf=id=>{const r=rat[id];return r&&(r.up>0||r.down>0)?` 👍${r.up} 👎${r.down}`:""};
function matchOf(a){
  if(!prof.nick||a.authorId===myId)return null;
  const ri=RANKS.indexOf(a.lvl),mi=RANKS.indexOf(prof.lvl);
  return {rank:ri>=0&&mi>=0&&Math.abs(ri-mi)<=1,role:!!(a.need&&prof.role&&a.need[prof.role]>0),srv:!!a.srv&&a.srv===prof.srv};
}
function matchHtml(a){
  const m=matchOf(a);if(!m)return "";
  const n=(m.rank?1:0)+(m.role?1:0)+(m.srv?1:0),f=(k,l)=>l.toLowerCase()+" "+(m[k]?"✓":"✗");
  return `<div class="note" style="margin-top:6px;color:${n===3?"var(--ok)":"var(--mut)"}">✨ ${t("match")} ${n}/3 · ${f("rank",t("rank"))} · ${f("role",t("role"))} · ${f("srv",t("srv"))}</div>`;
}
const canRate=id=>id!==myId&&(convs.some(c=>(c.parts||[]).includes(id))||groups.some(g=>(g.members||[]).includes(id)));
const rateHtml=id=>{const m=myRat[id];return `<span class="rate"><button class="sec ${m===1?"on":""}" data-rate="${esc(id)}" data-v="1">👍</button><button class="sec ${m===-1?"on":""}" data-rate="${esc(id)}" data-v="-1">👎</button></span>`};
async function rate(id,val){
  if(!db||!myId||id===myId)return;
  const old=myRat[id],r=rat[id]||(rat[id]={up:0,down:0});
  if(old===1)r.up--;if(old===-1)r.down--;
  if(val>0)r.up++;else r.down++;
  myRat[id]=val>0?1:-1;
  render();renderRateBar();if($("#pv").classList.contains("on")&&pvAd)showProfile(pvAd);
  await db.collection("ratings").doc(sid(id)+"_"+sid(myId)).set({ratedId:id,raterId:myId,up:val>0,at:Date.now()}).catch(()=>{});
}
function renderRateBar(){
  const o=thread&&thread.kind==="conv"&&thread.other;
  $("#rateBar").innerHTML=o&&canRate(o)?`${t("rate")}: ${esc(thread.title)} ${rateHtml(o)}<span class="rep">${repOf(o)}</span>`:"";
}

async function joinAd(adId){

    (verOf(a)?`<div class="pr"><span></span><b class="ok-v">${t("verified")}</b></div>`:"")+`<div class="pr"><span>${t("reputation")}</span><b>${repOf(a.authorId)||"—"}</b></div>`+(canRate(a.authorId)?`<div class="pr"><span>${t("rate")}</span>${rateHtml(a.authorId)}</div>`:"")+`<div class="acts">${a.authorId!==myId?`<button class="pri" style="margin:0;width:auto" data-chat2="${a.id}">${t("chat")}</button>`:""}${a.authorId!==myId?`<button class="sec" data-blkp="${esc(a.authorId)}" data-nick="${esc(a.nick)}">🚫 ${t("block")}</button>`:""}<button class="sec" data-pvx="1">${t("close")}</button></div>`;

  if(b.dataset.pvx)$("#pv").classList.remove("on");
  if(b.dataset.chat2){$("#pv").classList.remove("on");startChat(b.dataset.chat2)}
  if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent=t("copied")}catch(_){}}
};
let blocked={},hid={},msgIds=[],askRes=null;
try{blocked=JSON.parse(localStorage.getItem("blocked")||"{}")}catch(e){}
try{hid=JSON.parse(localStorage.getItem("hid")||"{}")}catch(e){}
const saveLS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hidden=x=>(x.kind==="conv"&&!!blocked[x.other])||(x.kind==="group"&&!!blocked[x.owner])||(hid[x.kind+":"+x.id]!=null&&(x.at||0)<=hid[x.kind+":"+x.id]);
function myThreads(){return allThreads().filter(x=>!hidden(x))}
function ask(msg){return new Promise(res=>{askRes=res;$("#pvBox").innerHTML=`<p>${esc(msg)}</p><div class="acts"><button class="pri" style="margin:0;width:auto" data-y="1">OK</button><button class="sec" data-y="0">${t("cancel")}</button></div>`;$("#pv").classList.add("on")})}
function closeChat(){$("#cClose").onclick()}
async function blockUser(id,nick){
  if(!id||id===myId)return;
  if(!await ask(t("confirmBlock").replace("{n}",nick)))return;
  blocked[id]=nick;saveLS("blocked",blocked);
  if(thread&&thread.kind==="conv"&&thread.other===id)closeChat();
  render();renderChats();updateBadge();
  if(thread&&$("#chat").classList.contains("on"))openThread(thread);
}
function unblock(id){delete blocked[id];saveLS("blocked",blocked);render();renderChats();updateBadge()}
function renderActs(){
  const bar=$("#actBar");if(!thread){bar.innerHTML="";return}
  let h="";
  if(thread.kind==="conv"){
    if(thread.other)h+=`<button class="sec" data-act="block">🚫 ${t("block")}</button>`;
    if(!thread.fresh)h+=`<button class="sec" data-act="del">🗑 ${t("delChat")}</button>`;
  }else{
    const g=groups.find(x=>x.id===thread.id);
    if(g&&g.ownerId===myId)h+=`<button class="sec" data-act="delg">🗑 ${t("delGroup")}</button>`;
    else if(g)h+=`<button class="sec" data-act="leave">🚪 ${t("leaveGroup")}</button>`;
  }
  bar.innerHTML=h;
}
$("#actBar").onclick=async e=>{
  const b=e.target.closest("button");if(!b||!thread||!db)return;
  const th=thread,act=b.dataset.act;
  if(act==="block")blockUser(th.other,th.title);
  if(act==="del"){
    if(!await ask(t("confirmDel")))return;
    const cur=allThreads().find(x=>same(x,th));
    hid[th.kind+":"+th.id]=(cur&&cur.at)||Date.now();saveLS("hid",hid);
    closeChat();renderChats();updateBadge();
  }
  if(act==="delg"){
    if(!await ask(t("confirmDelG")))return;
    await Promise.all(msgIds.map(i=>db.collection(th.path+"/msgs").doc(i).delete().catch(()=>{})));
    await db.collection("groups").doc(th.id).delete().catch(()=>{});
    closeChat();
  }
  if(act==="leave"){
    const g=groups.find(x=>x.id===th.id);if(!g)return;
    if(!await ask(t("confirmLeave")))return;
    const k=(g.members||[]).indexOf(myId);
    await db.collection("groups").doc(th.id).update({members:(g.members||[]).filter(m=>m!==myId),nicks:(g.nicks||[]).filter((_,i)=>i!==k)}).catch(()=>{});
    closeChat();
  }
};
$("#msgs").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.blk)blockUser(b.dataset.blk,b.dataset.nick)};
function allThreads(){
  const a=convs.map(c=>({kind:"conv",id:c.id,path:"convs/"+c.id,title:c.ownerId===myId?c.respNick:c.ownerNick,sub:c.tour+(c.date?" · "+c.date:""),at:c.lastAt||0,by:c.lastBy,other:c.ownerId===myId?c.respId:c.ownerId,last:c.lastText||""}));
  const g=groups.map(x=>({kind:"group",id:x.id,path:"groups/"+x.id,title:"👥 "+(x.name||t("group")),sub:x.tour+" · "+(x.nicks||[]).join(", "),at:x.lastAt||0,by:x.lastBy,owner:x.ownerId,last:x.lastText||""}));
  return a.concat(g).sort((p,q)=>q.at-p.at);
}
const same=(x,y)=>x&&y&&x.kind===y.kind&&x.id===y.id;
function renderChips(){
  const ts=myThreads();if(thread&&!ts.some(x=>same(x,thread)))ts.unshift(thread);
  $("#chips").innerHTML=ts.map(x=>`<button class="chip ${same(x,thread)?"on":""}" data-k="${x.kind}" data-i="${esc(x.id)}">${esc(x.title)}${unr(x)?'<i class="dot"></i>':""}</button>`).join("");
}
function renderChats(){
  const box=$("#chatList");
  if(!db||!myId){box.innerHTML=`<div class="empty">${t("loginMsg")}</div>`;return}
  let h="";
  ads.filter(a=>a.authorId===myId).forEach(a=>{
    const cs=convs.filter(c=>c.adId===a.id&&c.ownerId===myId).sort((p,q)=>(q.lastAt||0)-(p.lastAt||0));
    if(!cs.length)return;
    h+=`<div class="card"><b>${esc(a.tour)}</b>${a.date?" · "+esc(a.date):""}<div class="note">${t("pickGroup")}</div>`+
      cs.map(c=>`<div class="pick"><input type="checkbox" data-g="${a.id}" value="${esc(c.respId)}" data-nick="${esc(c.respNick)}"><button class="sec" data-open="conv:${esc(c.id)}">💬 ${esc(c.respNick)}</button>${unr({kind:"conv",id:c.id,at:c.lastAt,by:c.lastBy})?'<i class="dot"></i>':""}<small>${esc(c.lastText||"")}</small></div>`).join("")+
      `<button class="pri" data-mk="${a.id}">${t("mkGroup")}</button></div>`;
  });
  const ts=myThreads();
  h+=`<h2>${t("allChats")}</h2>`+(ts.length?ts.map(x=>`<button class="th ${same(x,thread)?"on":""}" data-open="${x.kind}:${esc(x.id)}"><b>${esc(x.title)}</b>${unr(x)?'<i class="dot"></i>':""}<small>${esc(x.sub)}</small><small>${esc(x.last)}</small></button>`).join(""):`<div class="empty">${t("noChats")}</div>`);
  const bl=Object.entries(blocked);
  if(bl.length)h+=`<h2>🚫 ${t("blockedH")}</h2>`+bl.map(([id,n])=>`<div class="pick"><b>${esc(n)}</b><span style="flex:1"></span><button class="sec" data-unblock="${esc(id)}">${t("unblock")}</button></div>`).join("");
  box.innerHTML=h;
}
function openThread(th){
  if(!db)return;
  if(hid[th.kind+":"+th.id]!=null){delete hid[th.kind+":"+th.id];saveLS("hid",hid)}
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  thread=th;$("#cTitle").textContent=th.title;$("#cSub").textContent=th.sub;$("#chat").classList.add("on");$("#msgs").innerHTML="";
  const cur=myThreads().find(x=>same(x,th));if(cur)markSeen(cur);
  updateBadge();renderChats();renderChips();renderRateBar();renderActs();
  if(th.fresh){$("#msgs").innerHTML=`<div class="empty">${t("hello")}</div>`;return}
  unsubMsgs=db.collection(th.path+"/msgs").orderBy("at","asc").onSnapshot(snap=>{
    $("#msgs").innerHTML=(msgIds=snap.docs.map(d=>d.id),snap.docs.map(d=>d.data()).filter(x=>!blocked[x.authorId]).map(x=>`<div class="m ${x.authorId===myId?"me":""}"><small>${esc(x.nick)}${x.authorId!==myId?` <button class="blk" data-blk="${esc(x.authorId)}" data-nick="${esc(x.nick)}">🚫</button>`:""}</small>${esc(x.text)}</div>`).join(""))||`<div class="empty">${t("hello")}</div>`;
    $("#msgs").scrollTop=1e9;
  },()=>{});
}
function startChat(adId){
  const a=ads.find(x=>x.id===adId);if(!a||!db)return;
  if(!myId)return alert(t("alertDb"));
  if(a.authorId===myId){showTab("chats");return}
  const id=adId+"_"+sid(myId),ex=allThreads().find(x=>x.kind==="conv"&&x.id===id);
  openThread(ex||{kind:"conv",id,path:"convs/"+id,title:a.nick,sub:a.tour+(a.date?" · "+a.date:""),at:0,last:"",other:a.authorId,fresh:a});
}
async function mkGroup(adId){
  const a=ads.find(x=>x.id===adId);if(!a||!db)return;
  const bx=[...document.querySelectorAll('input[data-g="'+adId+'"]:checked')];
  if(!bx.length)return alert(t("alertGroup"));
  const members=[myId],nicks=[prof.nick||a.nick];
  bx.forEach(b=>{members.push(b.value);nicks.push(b.dataset.nick)});
  const now=Date.now(),ref=await db.collection("groups").add({adId,tour:a.tour,date:a.date||"",ownerId:myId,members,nicks,name:a.tour,lastAt:now,lastBy:myId,lastText:""});
  openThread({kind:"group",id:ref.id,path:"groups/"+ref.id,title:"👥 "+a.tour,sub:a.tour+" · "+nicks.join(", "),at:now,last:""});
}
$("#chatList").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.mk)mkGroup(b.dataset.mk);
  if(b.dataset.unblock)unblock(b.dataset.unblock);
  if(b.dataset.open){const [k,...r]=b.dataset.open.split(":"),id=r.join(":");const th=myThreads().find(x=>x.kind===k&&x.id===id);if(th)openThread(th)}
};
$("#chips").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const th=myThreads().find(x=>x.kind===b.dataset.k&&x.id===b.dataset.i);if(th)openThread(th);
};
$("#cClose").onclick=()=>{$("#chat").classList.remove("on");if(unsubMsgs){unsubMsgs();unsubMsgs=null}thread=null;renderChats();updateBadge()};
async function send(){
  const x=$("#cIn").value.trim();if(!x||!thread)return;
  if(!prof.nick)return alert(t("alertProf"));
  $("#cIn").value="";
  return sendText(thread,x);
}
async function sendText(th,x){
  const now=Date.now(),last=x.slice(0,80);
  try{
    const ref=db.collection(th.kind==="conv"?"convs":"groups").doc(th.id);
    const addMsg=()=>db.collection(th.path+"/msgs").add({authorId:myId,nick:prof.nick,text:x,at:now});
    if(th.fresh){
      const a=th.fresh;
      await ref.set({adId:a.id,tour:a.tour,date:a.date||"",ownerId:a.authorId,ownerNick:a.nick,respId:myId,respNick:prof.nick,parts:[a.authorId,myId],lastAt:now,lastBy:myId,lastText:last});
      th.fresh=null;await addMsg();openThread(th);
    }else{await addMsg();await ref.update({lastAt:now,lastBy:myId,lastText:last})}
  }catch(e){console.error(e)}
}
$("#cSend").onclick=send;$("#cIn").onkeydown=e=>{if(e.key==="Enter")send()};

applyLang();
if(Object.values(firebaseConfig).some(v=>String(v).startsWith("COLE_AQUI"))){
  $("#list").innerHTML=`<div class="empty">${t("setup")}</div>`;
  $("#authBtn").hidden=true;
}else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app);
  let unsubR=null;
  db=mkDb(getFirestore(app));
  doLogin=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>{});
  doLogout=()=>signOut(auth);
  $("#authBtn").onclick=()=>auth.currentUser?doLogout():doLogin();
  onAuthStateChanged(auth,u=>{
    [unsubAds,unsubC,unsubG,unsubMsgs,unsubR].forEach(f=>f&&f());unsubAds=unsubC=unsubG=unsubMsgs=unsubR=null;
    myId=u?u.uid:null;ads=[];convs=[];groups=[];rat={};myRat={};loaded=false;thread=null;
    $("#chat").classList.remove("on");
    const b=$("#authBtn");b.dataset.i18n=u?"logout":"login";b.textContent=t(b.dataset.i18n);
    if(u&&!prof.nick&&u.displayName&&editing)$("#pNick").value=u.displayName.split(" ")[0];
    render();renderChats();
    if(!u)return;
    unsubC=db.collection("convs").where("parts","array-contains",myId).onSnapshot(sn=>{convs=sn.docs.map(d=>({id:d.id,...d.data()}));refreshChats()},()=>{});
    unsubG=db.collection("groups").where("members","array-contains",myId).onSnapshot(sn=>{groups=sn.docs.map(d=>({id:d.id,...d.data()}));refreshChats()},()=>{});
    unsubR=db.collection("ratings").onSnapshot(sn=>{rat={};myRat={};sn.docs.forEach(d=>{const x=d.data(),r=rat[x.ratedId]||(rat[x.ratedId]={up:0,down:0});x.up?r.up++:r.down++;if(x.raterId===myId)myRat[x.ratedId]=x.up?1:-1});render();renderRateBar()},()=>{});
    unsubAds=db.collection("ads").orderBy("createdAt","desc").onSnapshot(sn=>{loaded=true;ads=sn.docs.map(d=>({id:d.id,...d.data()}));render();renderChats()},()=>{loaded=true;render()});
  });
}
</script>
</body>
</html>
